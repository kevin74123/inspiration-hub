<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>노션 데이터 텍스트 변환기</title>
  <style>
    body {
      background: #121212;
      color: #e0e0e0;
      font-family: monospace; /* 텍스트 정렬이 깔끔한 고정폭 글꼴 */
      padding: 20px;
      line-height: 1.6;
    }
    h2 {
      font-size: 16px;
      color: #888;
      border-bottom: 1px solid #333;
      padding-bottom: 5px;
      margin-top: 30px;
    }
    pre {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 6px;
      white-space: pre-wrap; /* 화면 크기에 맞게 자동 줄바꿈 */
      word-wrap: break-word;
      font-size: 13px;
    }
    #loading { color: #888; }
    #error { color: #ff6b6b; display: none; }
  </style>
</head>
<body>

  <div id="loading">Worker에서 노션 데이터를 불러오는 중...</div>
  <div id="error">데이터를 불러오지 못했습니다. Worker URL이나 권한을 확인하세요.</div>

  <h2>[ 1. 정제된 노션 일정/데이터 목록 ]</h2>
  <pre id="parsed-text"></pre>

  <h2>[ 2. 원본 RAW JSON 데이터 ]</h2>
  <pre id="raw-json"></pre>

  <script>
    const WORKER_URL = "https://divine-cell-e667.gunwo742.workers.dev";

    async function load() {
      try {
        const res = await fetch(WORKER_URL);
        const data = await res.json();

        // 로딩 메시지 숨기기
        document.getElementById('loading').style.display = 'none';

        // 1. 원본 RAW JSON을 텍스트로 출력 (정렬 적용)
        document.getElementById('raw-json').textContent = JSON.stringify(data, null, 2);

        // 2. 노션 데이터를 사람이 읽기 좋은 텍스트 리스트로 변환
        const results = Array.isArray(data) ? data : (data.results || []);
        let plainText = "";

        const filteredPages = results.filter(p => p.object === 'page');

        if (filteredPages.length === 0) {
          plainText = "가져올 페이지 데이터가 없습니다.";
        } else {
          filteredPages.forEach((p, index) => {
            const title = p.properties?.이름?.title?.[0]?.plain_text || '(제목 없음)';
            const url = p.url || '링크 없음';
            const date = p.last_edited_time || p.created_time || '날짜 없음';

            if (title !== '(제목 없음)') {
              plainText += `[${index + 1}] ----------------------------------------\n`;
              plainText += `📌 제목: ${title}\n`;
              plainText += `📅 날짜: ${date}\n`;
              plainText += `🔗 링크: ${url}\n\n`;
            }
          });
        }

        document.getElementById('parsed-text').textContent = plainText;

      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        console.error(e);
      }
    }

    load();
  </script>

</body>
</html>
