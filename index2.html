<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedule — Nikodēmos</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0A0A0A;
    --surface: #111111;
    --card: #161616;
    --border: #222222;
    --gold: #C8B89A;
    --text: #F0EAE0;
    --text-muted: #6A6460;
    --text-dim: #3A3632;
    --red: #C87A6A;
    --blue: #7A9AC8;
    --yellow: #C8B86A;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 40px 22px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 400;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .month-title {
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.04em;
    color: var(--text);
    min-width: 180px;
    text-align: center;
  }

  .nav-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    transition: border-color 0.2s, color 0.2s;
  }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); }

  .today-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    font-size: 10px;
    font-family: inherit;
    font-weight: 300;
    letter-spacing: 0.12em;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .today-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* LOADING */
  .loading-bar { height: 1px; background: var(--border); overflow: hidden; position: relative; }
  .loading-bar.active::after {
    content: '';
    position: absolute;
    left: -40%; width: 40%; height: 100%;
    background: var(--gold);
    animation: slide 0.9s ease-in-out infinite;
  }
  @keyframes slide { to { left: 140%; } }

  /* ERROR */
  .error-msg {
    display: none;
    padding: 10px 40px;
    font-size: 11px;
    color: var(--red);
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  .error-msg.show { display: block; }

  /* CALENDAR */
  .calendar-wrap { padding: 0 40px 40px; }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-bottom: 1px solid var(--border);
  }

  .weekday {
    padding: 14px 0 10px;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    text-align: center;
    font-weight: 400;
  }
  .weekday:first-child { color: rgba(200,122,106,0.5); }
  .weekday:last-child  { color: rgba(122,154,200,0.5); }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    border-left: 1px solid var(--border);
  }

  .cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    min-height: 108px;
    padding: 9px 9px 7px;
    transition: background 0.12s;
  }
  .cell:hover { background: var(--surface); }
  .cell.other-month { opacity: 0.28; }
  .cell.today { box-shadow: inset 0 0 0 1px var(--gold); }

  .date-num {
    font-size: 11px;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    margin-bottom: 5px;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .cell.today .date-num { color: var(--gold); }
  .cell.sun .date-num { color: rgba(200,122,106,0.55); }
  .cell.sat .date-num { color: rgba(122,154,200,0.55); }
  .cell.today.sun .date-num,
  .cell.today.sat .date-num { color: var(--gold); }

  .today-dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--gold);
    display: none;
  }
  .cell.today .today-dot { display: block; }

  /* EVENTS */
  .event {
    display: block;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.01em;
    padding: 3px 6px 3px 8px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
    position: relative;
    line-height: 1.45;
    border-left: 2px solid transparent;
  }

  .event.type-일정  { background: rgba(200,122,106,0.09); color: #D4A49A; border-left-color: var(--red); }
  .event.type-할일  { background: rgba(122,154,200,0.09); color: #9AB4D4; border-left-color: var(--blue); }
  .event.type-일기  { background: rgba(200,184,106,0.09); color: #C8BC8A; border-left-color: var(--yellow); }
  .event.done { opacity: 0.3; text-decoration: line-through; }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 20px;
    padding: 16px 40px;
    border-top: 1px solid var(--border);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.1em; color: var(--text-muted); }
  .legend-dot { width: 8px; height: 2px; }

  /* TOOLTIP */
  .tooltip {
    position: fixed;
    background: #1A1A1A;
    border: 1px solid var(--border);
    padding: 10px 14px;
    font-size: 11px;
    pointer-events: none;
    z-index: 200;
    max-width: 210px;
    display: none;
    line-height: 1.6;
    font-family: inherit;
  }
  .tooltip.show { display: block; }
  .tt-title { color: var(--text); margin-bottom: 3px; font-weight: 400; }
  .tt-date  { color: var(--text-muted); font-size: 10px; letter-spacing: 0.05em; }
  .tt-tags  { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .tt-tag {
    font-size: 9px; letter-spacing: 0.1em;
    padding: 1px 5px;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">Nikodēmos — Schedule</div>
  <div class="month-nav">
    <button class="nav-btn" id="prevBtn">&#8592;</button>
    <div class="month-title" id="monthTitle"></div>
    <button class="nav-btn" id="nextBtn">&#8594;</button>
  </div>
  <button class="today-btn" id="todayBtn">오늘</button>
</div>

<div class="loading-bar" id="loadingBar"></div>
<div class="error-msg" id="errorMsg"></div>

<div class="calendar-wrap">
  <div class="weekdays">
    <div class="weekday">Sun</div>
    <div class="weekday">Mon</div>
    <div class="weekday">Tue</div>
    <div class="weekday">Wed</div>
    <div class="weekday">Thu</div>
    <div class="weekday">Fri</div>
    <div class="weekday">Sat</div>
  </div>
  <div class="grid" id="calGrid"></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>일정</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>할일</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--yellow)"></div>일기</div>
</div>

<div class="tooltip" id="tooltip">
  <div class="tt-title" id="ttTitle"></div>
  <div class="tt-date"  id="ttDate"></div>
  <div class="tt-tags"  id="ttTags"></div>
</div>

<script>
const PROXY = "https://fragrant-thunder-0cc5.gunwo742.workers.dev";
const KR_MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];

// 타임존 무관하게 로컬 날짜 문자열 반환
function localDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

const _today = new Date();
const todayStr = localDateStr(_today);
let currentYear = _today.getFullYear();
let currentMonth = _today.getMonth(); // 0-indexed
let eventsCache = {};
const tooltip = document.getElementById("tooltip");

// 네비게이션
document.getElementById("prevBtn").onclick = () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } render(); };
document.getElementById("nextBtn").onclick = () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } render(); };
document.getElementById("todayBtn").onclick = () => { currentYear = _today.getFullYear(); currentMonth = _today.getMonth(); render(); };

// API fetch
async function fetchSchedule(year, month) {
  const key = `${year}-${month}`;
  if (eventsCache[key]) return eventsCache[key];

  setLoading(true);
  setError("");

  // 해당 월 전체 + 앞뒤 여유
  const start = new Date(year, month - 1, 25);
  const end   = new Date(year, month + 1, 10);
  const url   = `${PROXY}/api/schedule?start=${localDateStr(start)}&end=${localDateStr(end)}`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if (data.object === "error") throw new Error(data.message || "Notion API 오류");

    const results = data.results || [];
    const events = results.map(parseEvent).filter(Boolean);
    eventsCache[key] = events;
    return events;
  } catch (e) {
    setError(`데이터를 불러오지 못했어요 — ${e.message}`);
    return [];
  } finally {
    setLoading(false);
  }
}

function parseEvent(page) {
  try {
    const props = page.properties;
    const titleArr = props["이름"]?.title;
    const title = (titleArr && titleArr.length > 0) ? titleArr[0].plain_text : "(제목 없음)";
    const dateP = props["날짜"]?.date;
    if (!dateP || !dateP.start) return null;

    const start = dateP.start.slice(0, 10);
    const end   = dateP.end ? dateP.end.slice(0, 10) : start;
    const type  = props["선택"]?.select?.name || "일정";
    const done  = props["완료"]?.checkbox || false;
    const imp   = props["중요도"]?.select?.name || "";

    return { title, start, end, type, done, imp };
  } catch(e) {
    return null;
  }
}

// 렌더
async function render() {
  document.getElementById("monthTitle").textContent = `${currentYear}년 ${KR_MONTHS[currentMonth]}`;
  const events = await fetchSchedule(currentYear, currentMonth);
  renderGrid(events);
}

function renderGrid(events) {
  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const firstDay     = new Date(currentYear, currentMonth, 1).getDay();
  const daysInMonth  = new Date(currentYear, currentMonth + 1, 0).getDate();
  const daysInPrev   = new Date(currentYear, currentMonth, 0).getDate();
  const totalCells   = Math.ceil((firstDay + daysInMonth) / 7) * 7;
  const DOW_CLASS    = ["sun","","","","","","sat"];

  for (let i = 0; i < totalCells; i++) {
    let d, isOther = false;
    if (i < firstDay) {
      d = new Date(currentYear, currentMonth - 1, daysInPrev - firstDay + 1 + i);
      isOther = true;
    } else if (i >= firstDay + daysInMonth) {
      d = new Date(currentYear, currentMonth + 1, i - firstDay - daysInMonth + 1);
      isOther = true;
    } else {
      d = new Date(currentYear, currentMonth, i - firstDay + 1);
    }

    const ds      = localDateStr(d);
    const isToday = ds === todayStr;
    const dow     = d.getDay();

    const cell = document.createElement("div");
    cell.className = [
      "cell",
      isOther ? "other-month" : "",
      isToday ? "today" : "",
      DOW_CLASS[dow]
    ].filter(Boolean).join(" ");

    // 날짜 숫자
    const dn = document.createElement("div");
    dn.className = "date-num";
    dn.innerHTML = `${d.getDate()}<span class="today-dot"></span>`;
    cell.appendChild(dn);

    // 이벤트 출력 (날짜가 start~end 범위 안에 들어오는 것)
    events
      .filter(ev => ds >= ev.start && ds <= ev.end)
      .forEach(ev => {
        const typeClass =
          ev.type === "할일 목록" ? "type-할일" :
          ev.type === "일기"      ? "type-일기"  : "type-일정";

        const el = document.createElement("div");
        el.className = `event ${typeClass}${ev.done ? " done" : ""}`;
        el.textContent = ev.title;

        el.addEventListener("mouseenter", e => showTT(e, ev));
        el.addEventListener("mousemove",  moveTT);
        el.addEventListener("mouseleave", hideTT);
        cell.appendChild(el);
      });

    grid.appendChild(cell);
  }
}

// 툴팁
function showTT(e, ev) {
  document.getElementById("ttTitle").textContent = ev.title;
  document.getElementById("ttDate").textContent  =
    ev.start === ev.end ? fmtKR(ev.start) : `${fmtKR(ev.start)} → ${fmtKR(ev.end)}`;
  const tags = document.getElementById("ttTags");
  tags.innerHTML = "";
  [ev.type, ev.imp, ev.done ? "완료" : ""].filter(Boolean).forEach(t => {
    const s = document.createElement("span");
    s.className = "tt-tag";
    s.textContent = t;
    tags.appendChild(s);
  });
  tooltip.classList.add("show");
  moveTT(e);
}
function moveTT(e) {
  tooltip.style.left = (e.clientX + 14) + "px";
  tooltip.style.top  = (e.clientY - 8)  + "px";
}
function hideTT() { tooltip.classList.remove("show"); }

function fmtKR(str) {
  if (!str) return "";
  const [y, m, d] = str.split("-");
  return `${y}년 ${+m}월 ${+d}일`;
}

function setLoading(on) { document.getElementById("loadingBar").classList.toggle("active", on); }
function setError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.classList.toggle("show", !!msg);
}

render();
</script>
</body>
</html>
